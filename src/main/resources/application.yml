spring:
  application:
    name: ledger-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      # The pool is the real concurrency limit. Sized deliberately: enough to keep
      # Postgres busy, small enough that a contended account queues in the pool
      # (cheap) rather than piling up lock waits in the database (expensive).
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: ledger-pool

  jpa:
    hibernate:
      # Never let Hibernate touch the schema. Flyway owns it -- including the
      # constraint trigger, which ddl-auto could not express and would drop.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Fail loudly rather than silently degrading to N+1 lazy loads in a
        # controller after the session closed.
        enable_lazy_load_no_trans: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  transaction:
    default-timeout: 10

  jackson:
    deserialization:
      # CRITICAL for a ledger. Jackson's default accepts a JSON float for an
      # integer field and TRUNCATES it: {"amountMinor": 10.55} would silently
      # become 10, losing 55 paise with no error anywhere. Money is integer minor
      # units, so a decimal amount is a malformed request and must be rejected.
      accept-float-as-int: false
      # An unrecognised field usually means the client is sending a version of
      # the request we do not understand. Better a loud 400 than quietly ignoring
      # half of what they asked for.
      fail-on-unknown-properties: true
    # Deliberately NOT non_null. Omitting null fields makes a paginated response
    # ambiguous: a client cannot distinguish "nextCursor is null, you are on the
    # last page" from "nextCursor is missing, maybe this build does not support
    # paging". Always emitting the field keeps the response shape stable.

server:
  port: ${PORT:8080}
  error:
    # We produce RFC 7807 bodies ourselves; Spring's default whitelabel error
    # page must not shadow them.
    whitelabel:
      enabled: false

ledger:
  # optimistic | pessimistic -- see README for the benchmark of both.
  concurrency: ${LEDGER_CONCURRENCY:optimistic}
  retry:
    # Sized for the 100-thread hot-account test, where every write conflicts.
    # A budget of 8 left ~1/3 of threads failing outright; 25 capped-backoff
    # attempts absorb it. The pessimistic strategy needs none of these.
    max-attempts: ${LEDGER_RETRY_ATTEMPTS:25}
    base-backoff-ms: ${LEDGER_RETRY_BACKOFF_MS:5}
    max-backoff-ms: ${LEDGER_RETRY_MAX_BACKOFF_MS:200}
  reconciliation:
    interval-ms: ${LEDGER_RECONCILE_INTERVAL_MS:30000}
    initial-delay-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Publish the percentiles the README quotes, computed server-side rather
      # than estimated from a client's sample.
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ledger: INFO
    org.hibernate.SQL: WARN
